<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>РНП отдела продаж</title>


<style>
/* Layout: плотная операционная панель — закреплённая шапка с выбором месяца, рельс вкладок, плитки сводки над прокручиваемой матрицей дней */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --surface-3:#eaeff3;
  --ink:#141c24; --ink-2:#4a5a68; --ink-3:#7b8b99;
  --line:#d3dbe3; --line-2:#e7ecf1;
  --accent:#b4541a; --accent-soft:#fbeee4; --steel:#2d6a8c;
  --good:#1b7a4b; --good-soft:#e6f3ec; --warn:#a86f00; --warn-soft:#fbf1dd; --bad:#a8232b; --bad-soft:#fae9ea;
  --fd:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fs:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fm:"Consolas","SF Mono",Menlo,"DejaVu Sans Mono","Courier New",monospace;
  --r:4px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#192026; --surface-2:#1e262d; --surface-3:#243038;
  --ink:#e8eef3; --ink-2:#a6b6c2; --ink-3:#76889a;
  --line:#2d3942; --line-2:#232c34;
  --accent:#e2884a; --accent-soft:#2a1d14; --steel:#6aaecd;
  --good:#45b07c; --good-soft:#15291f; --warn:#d9a13a; --warn-soft:#2a2214; --bad:#e3737a; --bad-soft:#2c1719;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#192026; --surface-2:#1e262d; --surface-3:#243038;
  --ink:#e8eef3; --ink-2:#a6b6c2; --ink-3:#76889a;
  --line:#2d3942; --line-2:#232c34;
  --accent:#e2884a; --accent-soft:#2a1d14; --steel:#6aaecd;
  --good:#45b07c; --good-soft:#15291f; --warn:#d9a13a; --warn-soft:#2a2214; --bad:#e3737a; --bad-soft:#2c1719;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fs);font-size:14px;line-height:1.45;margin:0}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:600;letter-spacing:.01em;text-wrap:balance}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}

/* ——— шапка ——— */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand b{font-family:var(--fd);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.brand span{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.spacer{flex:1 1 auto}
.mnav{display:flex;align-items:center;gap:6px}
.mnav select{font-family:var(--fs);font-size:13.5px;font-weight:600;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:5px 7px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:var(--r);cursor:pointer;font-size:14px;line-height:1}
.ib:hover{border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3);background:var(--surface-2);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.ok{color:var(--good);border-color:color-mix(in oklab,var(--good) 35%,var(--line));background:var(--good-soft)}
.pill.busy{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 35%,var(--line));background:var(--warn-soft)}
.pill.err{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 35%,var(--line));background:var(--bad-soft)}

/* ——— рельс вкладок ——— */
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:0 0 auto;appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);font-family:var(--fs);font-size:13px;font-weight:500;padding:9px 11px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .rl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-left:5px}

main{padding:16px;padding-block:16px 48px;max-width:1500px;margin:0 auto}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.sec-h h2{font-size:14.5px;text-transform:uppercase;letter-spacing:.09em}
.sec-h .hint{color:var(--ink-3);font-size:12px}

/* ——— плитки ——— */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px 12px;min-width:0}
.tile .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.tile .vl{font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:23px;font-weight:600;line-height:1.15;margin-top:3px;letter-spacing:-.01em}
.tile .sb{font-size:12px;color:var(--ink-2);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tile.lead{border-left:3px solid var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--surface-3);margin-top:9px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--steel)}
.bar.g>i{background:var(--good)}.bar.w>i{background:var(--warn)}.bar.b>i{background:var(--bad)}

.badge{font-family:var(--fm);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:3px;white-space:nowrap}
.badge.g{color:var(--good);background:var(--good-soft)}
.badge.w{color:var(--warn);background:var(--warn-soft)}
.badge.b{color:var(--bad);background:var(--bad-soft)}
.badge.n{color:var(--ink-3);background:var(--surface-3)}

/* ——— таблицы ——— */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0;z-index:2}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in oklab,var(--accent) 4%,var(--surface))}
td.nm{font-weight:500}
td.mono,th.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
tr.tot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.stick{position:sticky;left:0;z-index:3;background:var(--surface);box-shadow:1px 0 0 var(--line)}
th.stick{z-index:4;background:var(--surface-2)}
tbody tr:hover td.stick{background:color-mix(in oklab,var(--accent) 4%,var(--surface))}
tr.tot td.stick{background:var(--surface-2)}
.sub{color:var(--ink-3);font-size:11.5px;font-weight:400}

/* ——— поля ввода (зелёные поля из старой таблицы) ——— */
input,select,textarea{font-family:var(--fs);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 6px}
input:focus-visible,select:focus-visible,button:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.inp{background:var(--accent-soft);border-color:color-mix(in oklab,var(--accent) 22%,var(--line))}
input.inp:hover{border-color:var(--accent)}
input.cell{width:46px;padding:3px 4px;text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:12.5px}
input.money{width:102px;text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
input.txt{width:100%;min-width:190px}
input.lnk{width:100%;min-width:220px;font-family:var(--fm);font-size:11.5px}
td.wknd{background:var(--surface-2)}
td.today input.cell,th.today{box-shadow:inset 0 0 0 1px var(--accent)}
[disabled]{opacity:.55;cursor:not-allowed}

.btn{appearance:none;font-family:var(--fs);font-size:12.5px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{filter:brightness(1.08);color:#fff}
.btn.x{padding:3px 7px;font-size:11px;color:var(--ink-3);font-weight:500}
.btn.x:hover{color:var(--bad);border-color:var(--bad)}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}

/* ——— график ——— */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px}
.plot{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;gap:10px;height:148px;border-bottom:1px solid var(--line);position:relative;padding-top:18px}
.plot .grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2);pointer-events:none}
.col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.col .fill{width:min(100%,54px);background:var(--steel);border-radius:4px 4px 0 0;position:relative;transition:height .2s}
.col .fill.g{background:var(--good)}.col .fill.w{background:var(--warn)}.col .fill.b{background:var(--bad)}
.col .pl{position:absolute;left:8%;right:8%;height:0;border-top:2px dashed var(--accent);pointer-events:none}
.col .vl{position:absolute;left:0;right:0;text-align:center;font-family:var(--fm);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1}
.xlab{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:6px}
.xlab span{text-align:center;font-size:11px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:8px}
.legend b{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;font-family:var(--fm);padding:5px 8px;border-radius:3px;opacity:0;transition:opacity .12s;max-width:240px;white-space:pre-line}

.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:10px 13px;font-size:12.5px;color:var(--ink-2)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-family:var(--fd);font-size:16px;font-weight:500;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:9px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line-2)}
.fld:last-child{border-bottom:0}
.fld label{font-size:12.5px;color:var(--ink-2)}
.fld input{width:106px;text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}

/* ——— экран входа ——— */
#gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;max-width:470px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.gate-card h2{font-size:17px;margin-bottom:8px}
.gate-txt{color:var(--ink-2);font-size:13.5px}
.gate-txt code{font-family:var(--fm);font-size:12px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:3px;padding:1px 5px}
.gate-txt ol{margin:10px 0 0;padding-left:20px}
.gate-txt li{margin-bottom:5px}
.gmail{display:inline-flex;align-items:center;gap:9px;font-family:var(--fs);font-size:13.5px;font-weight:600;color:#1f1f1f;background:#fff;border:1px solid #747775;border-radius:var(--r);padding:9px 16px;cursor:pointer}
.gmail:hover{background:#f7f8f8}
.gmail svg{width:17px;height:17px;flex:0 0 auto}
.who{font-family:var(--fm);font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:3px;padding:3px 7px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  main{padding:12px;padding-block:12px 40px}
  .brand span{display:none}
  .tile .vl{font-size:20px}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand"><b>РНП</b><span>НИИ АТТ · отдел продаж</span></div>
    <div class="mnav">
      <button class="ib" id="prev" title="Предыдущий месяц" aria-label="Предыдущий месяц">‹</button>
      <select id="selM" aria-label="Месяц"></select>
      <select id="selY" aria-label="Год"></select>
      <button class="ib" id="next" title="Следующий месяц" aria-label="Следующий месяц">›</button>
    </div>
    <div class="spacer"></div>
    <span class="who" id="who" hidden></span>
    <span class="pill" id="status"><i></i><span>подключаюсь</span></span>
    <button class="btn x" id="signout" hidden>выйти</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>
<main id="main"></main>
<div id="gate" hidden></div>
<div id="tip"></div>

<script>
(function(){
'use strict';

/* ───────────── справочники ───────────── */
var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var METRICS={
  sales:[
    {k:'inWork',  n:'Сделок в работе',    agg:'last',unit:'шт', pu:'level'},
    {k:'invoices',n:'Выставлено счетов',  agg:'sum', unit:'шт', pu:'month'},
    {k:'payments',n:'Оплат',              agg:'sum', unit:'шт', pu:'month'}
  ],
  lead:[
    {k:'reqCall', n:'Заявки с прозвона',  agg:'sum', unit:'шт', pu:'month',src:'j'},
    {k:'reqLead', n:'Заявки с лида',      agg:'sum', unit:'шт', pu:'month',src:'j'},
    {k:'notOur',  n:'Не наш ассортимент', agg:'sum', unit:'шт', pu:'month',src:'j',lower:true},
    {k:'calls',   n:'Звонков от 1 мин.',  agg:'sum', unit:'шт', pu:'month'},
    {k:'line',    n:'Время в линии',      agg:'avg', unit:'мин/день',pu:'day'}
  ]
};
var MONEYM=[
  {k:'revenue',n:'Сумма поступлений',agg:'sum',unit:'₽',pu:null,money:true,der:true},
  {k:'cost',   n:'Себестоимость',    agg:'sum',unit:'₽',pu:null,money:true,der:true},
  {k:'margin', n:'Маржа',            agg:'sum',unit:'₽',pu:'month',money:true,der:true}
];
var DEF={sales:{margin:1000000,inWork:50,invoices:40,payments:30},
         lead:{reqCall:40,reqLead:40,notOur:0,calls:700,line:90}};
var PLANF={sales:[['margin','План по марже, ₽'],['inWork','Сделок в работе'],['invoices','Выставлено счетов'],['payments','Оплат']],
          lead:[['reqCall','Заявки с прозвона'],['reqLead','Заявки с лида'],['notOur','Не наш ассортимент (не больше)'],['calls','Звонков от 1 мин. за месяц'],['line','Время в линии, мин/день']]};
var JT=[['call','прозвон'],['lead','лид'],['no','не наш']];

/* ───────────── утилиты ───────────── */
var nf0=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
function fmt(v,money){ if(v==null||isNaN(v))return '—';
  if(money)return nf0.format(Math.round(v));
  return (Math.abs(v-Math.round(v))<0.05?nf0:nf1).format(v); }
function pctTxt(p){ return p==null?'—':nf0.format(p*100)+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
function ym(y,m){ return y+'-'+(m+1<10?'0':'')+(m+1); }
function nowYm(){ var d=new Date(); return ym(d.getFullYear(),d.getMonth()); }
function pym(s){ var a=s.split('-'); return {y:+a[0],m:+a[1]-1}; }
function daysIn(s){ var p=pym(s); return new Date(p.y,p.m+1,0).getDate(); }
function dowOf(s,d){ var p=pym(s); return new Date(p.y,p.m,d).getDay(); }
function weeksOf(s){ var n=daysIn(s),out=[],i=1,w=1; while(i<=n){ out.push({w:w,from:i,to:Math.min(i+6,n)}); i+=7; w++; } return out; }
function monthLabel(s){ var p=pym(s); return MONTHS[p.m]+' '+p.y; }
function shiftM(s,d){ var p=pym(s),dt=new Date(p.y,p.m+d,1); return ym(dt.getFullYear(),dt.getMonth()); }
function ls(k,v){ try{ if(v===undefined)return localStorage.getItem('rnp.'+k); localStorage.setItem('rnp.'+k,v); }catch(e){} return null; }

/* ───────────── состояние ───────────── */
var ME=null,isAdmin=false;
var S={month:nowYm(),view:'dept',roster:null,docs:{},ready:false,status:'init',statusMsg:'подключаюсь'};
var dirty={},timers={},saving={},pendingRebuild=false;

function people(){ return S.roster||[]; }
function pers(id){ var a=people(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function obj(x){ return (x&&typeof x==='object'&&!Array.isArray(x))?x:{}; }
function D(id){ var d=S.docs[id]; if(!d){ d=S.docs[id]={}; }
  d.daily=obj(d.daily); d.plan=obj(d.plan);
  if(!Array.isArray(d.clients))d.clients=[]; if(!Array.isArray(d.journal))d.journal=[]; return d; }
function planOf(id){ var p=pers(id)||{role:'sales'},o={},s=[DEF[p.role]||{},p.plan||{},D(id).plan||{}];
  for(var i=0;i<s.length;i++) for(var k in s[i]) if(s[i][k]!==''&&s[i][k]!=null) o[k]=+s[i][k];
  return o; }
function MK(role,k){ var a=METRICS[role]||[],i; for(i=0;i<a.length;i++) if(a[i].k===k) return a[i]; return null; }
function metricsOf(id){ var p=pers(id)||{role:'sales'}; var a=METRICS[p.role].slice();
  if(p.role==='sales') a=a.concat(MONEYM); return a; }
function inputMetrics(id){ return metricsOf(id).filter(function(m){ return !m.der && !m.src; }); }

/* ───────────── расчёты ───────────── */
function series(id,k){
  var p=pers(id)||{role:'sales'},n=daysIn(S.month),d=D(id),out=new Array(n+1),i;
  for(i=0;i<=n;i++) out[i]=null;
  if(k==='revenue'||k==='cost'||k==='margin'){
    for(i=0;i<d.clients.length;i++){ var r=d.clients[i],day=+r.d;
      if(day>=1&&day<=n){ var rv=+r.rev||0,cs=+r.cost||0,v=k==='revenue'?rv:(k==='cost'?cs:rv-cs);
        out[day]=(out[day]||0)+v; } }
    return out;
  }
  if(p.role==='lead'&&(k==='reqCall'||k==='reqLead'||k==='notOur')){
    var t=k==='reqCall'?'call':(k==='reqLead'?'lead':'no');
    for(i=0;i<d.journal.length;i++){ var j=d.journal[i],dy=+j.d;
      if(dy>=1&&dy<=n&&j.t===t) out[dy]=(out[dy]||0)+1; }
    return out;
  }
  for(i=1;i<=n;i++){ var raw=(d.daily[i]||{})[k];
    out[i]=(raw===''||raw==null||isNaN(+raw))?null:+raw; }
  return out;
}
function aggr(ser,from,to,how){
  var sum=0,cnt=0,last=null;
  for(var i=from;i<=to;i++){ var v=ser[i]; if(v==null||isNaN(v))continue; sum+=v; cnt++; last=v; }
  if(how==='avg') return cnt?sum/cnt:null;
  if(how==='last') return last;
  return sum;
}
function planRange(id,m,from,to){
  var pl=planOf(id),base=pl[m.k];
  if(base==null||m.pu==null) return null;
  if(m.pu==='month') return base*(to-from+1)/daysIn(S.month);
  return base;
}
function tone(m,fact,plan){
  if(plan==null||fact==null) return 'n';
  if(m.lower){ if(plan<=0) return (fact||0)<=0?'g':'b';
    var r=fact/plan; return r<=1?'g':(r<=1.2?'w':'b'); }
  if(plan<=0) return 'n';
  var q=fact/plan; return q>=1?'g':(q>=0.85?'w':'b');
}
function cell(id,m,from,to){
  var f=aggr(series(id,m.k),from,to,m.agg),p=planRange(id,m,from,to);
  return {f:f,p:p,pct:(p!=null&&p>0&&f!=null)?f/p:null,t:tone(m,f,p)};
}
function monthCell(id,m){ return cell(id,m,1,daysIn(S.month)); }
function salesIds(){ return people().filter(function(p){return p.role==='sales';}).map(function(p){return p.id;}); }
function leadIds(){ return people().filter(function(p){return p.role==='lead';}).map(function(p){return p.id;}); }

/* ───────────── обмен с сервером ───────────── */
function api(a,body){
  var o={method:body?'POST':'GET',credentials:'same-origin',headers:{'Accept':'application/json'}};
  if(body){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(body); }
  return fetch('api.php?a='+a,o).then(function(r){
    return r.text().then(function(t){
      var j; try{ j=JSON.parse(t); }catch(e){ throw {error:'bad_response',detail:t.slice(0,200)}; }
      if(!r.ok||j.error) throw j; return j;
    });
  });
}
function setStatus(st,msg){ S.status=st; S.statusMsg=msg; var e=document.getElementById('status');
  if(!e)return; e.className='pill'+(st==='saved'?' ok':st==='saving'?' busy':st==='err'?' err':'');
  e.lastElementChild.textContent=msg; }
function canEdit(pid){ return !!(isAdmin||(ME&&ME.pid&&ME.pid===pid)); }
function dis(pid){ return canEdit(pid)?'':' disabled'; }

function markSave(id){
  if(!canEdit(id)) return;
  var key=S.month+'|'+id; dirty[key]=true; setStatus('saving','сохраняю');
  clearTimeout(timers[key]); timers[key]=setTimeout(function(){ flush(S.month,id,key); },600);
}
function flush(month,id,key){
  if(saving[key]){ timers[key]=setTimeout(function(){flush(month,id,key);},300); return; }
  saving[key]=true;
  var d=D(id),body={daily:d.daily,clients:d.clients,journal:d.journal,plan:d.plan};
  api('save',{month:month,person:id,doc:JSON.parse(JSON.stringify(body))}).then(function(){
    delete dirty[key]; saving[key]=false;
    setStatus(Object.keys(dirty).length?'saving':'saved',Object.keys(dirty).length?'сохраняю':'сохранено');
  },function(e){
    saving[key]=false;
    if(e&&e.error==='auth'){ ME=null; showGate('login'); return; }
    setStatus('err',e&&e.error==='forbidden'?'нет прав на эту вкладку':'не сохранилось');
  });
}
function saveRoster(){
  if(!isAdmin) return;
  setStatus('saving','сохраняю');
  api('roster',{people:JSON.parse(JSON.stringify(people()))}).then(function(){
    setStatus('saved','сохранено');
  },function(){ setStatus('err','не сохранилось'); });
}
function pull(){
  if(!ME) return Promise.resolve();
  var month=S.month;
  return api('state&month='+month).then(function(j){
    if(month!==S.month) return;
    S.roster=Array.isArray(j.people)?j.people:[];
    ME=j.me||ME; isAdmin=!!(ME&&ME.admin);
    var docs=j.docs||{};
    for(var pid in docs){ if(dirty[month+'|'+pid]) continue; S.docs[pid]=docs[pid]; }
    for(var k in S.docs){ if(!docs[k]&&!dirty[month+'|'+k]) delete S.docs[k]; }
    S.ready=true;
    if(S.status!=='err'&&!Object.keys(dirty).length) setStatus('saved','сохранено');
    scheduleRebuild();
  },function(e){
    if(e&&e.error==='auth'){ ME=null; stopPoll(); showGate('login'); return; }
    setStatus('err','нет связи с сервером');
  });
}
var pollTimer=null;
function startPoll(){ stopPoll(); pollTimer=setInterval(function(){ if(!document.hidden) pull(); },8000); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function deptTotals(){
  var ids=salesIds(),r={rev:0,cost:0,margin:0,mplan:0,pay:0,inv:0},n=daysIn(S.month);
  ids.forEach(function(id){
    r.rev+=aggr(series(id,'revenue'),1,n,'sum');
    r.cost+=aggr(series(id,'cost'),1,n,'sum');
    r.margin+=aggr(series(id,'margin'),1,n,'sum');
    r.mplan+=(planOf(id).margin||0);
    r.pay+=aggr(series(id,'payments'),1,n,'sum');
    r.inv+=aggr(series(id,'invoices'),1,n,'sum');
  });
  var lr=0,lp=0;
  leadIds().forEach(function(id){
    lr+=aggr(series(id,'reqCall'),1,n,'sum')+aggr(series(id,'reqLead'),1,n,'sum');

}

function saveLogins(){
  if(!isAdmin) return;
  setStatus('saving','сохраняю');
  api('roster',{people:JSON.parse(JSON.stringify(people()))}).then(function(){ setStatus('saved','сохранено'); },

function setPassword(i){
  var p=people()[i]; if(!p) return;
  var msg=document.getElementById('pwmsg_'+i);
  if(!p.login){ if(msg) msg.textContent='сначала впиши логин'; return; }
  var pw=genPw();
  api('passwd',{person:p.id,password:pw}).then(function(){
    if(msg){ msg.innerHTML='новый пароль: <b class="num">'+esc(pw)+'</b> — передай лично';
      msg.style.color='var(--ink)'; }
  },function(){ if(msg) msg.textContent='не получилось'; });
}
function genPw(){
  var a='abcdefghijkmnpqrstuvwxyz23456789',s='',i;
  for(i=0;i<8;i++) s+=a.charAt(Math.floor(Math.random()*a.length));
  return s;
}

function rebuild(){
  renderHead(); renderTabs();
  var m=document.getElementById('main');
  if(!S.ready&&!people().length){
    m.innerHTML='<div class="sec"><div class="tiles">'+
      tileHTML('Маржа отдела','—','загружаю данные…',null,'',1)+tileHTML('Поступления','—','',null,'')+
      tileHTML('Оплат за месяц','—','',null,'')+tileHTML('Заявок от КЦ','—','',null,'')+'</div></div>'+
      '<div class="empty"><b>Подключаюсь к общей базе</b>Сейчас подтянутся состав отдела и цифры за '+esc(monthLabel(S.month))+'.</div>';
    return;
  }
  if(S.view==='dept') m.innerHTML=viewDept();
  else if(S.view==='cfg') m.innerHTML=viewCfg();
  else if(pers(S.view)) m.innerHTML=viewPerson(S.view);
  else { S.view='dept'; m.innerHTML=viewDept(); }
}
function refresh(){
  function put(idn,html){ var e=document.getElementById(idn); if(e) e.innerHTML=html; }
  if(S.view==='dept'){ put('deptTiles',deptTilesHTML()); put('deptTable',deptTableHTML()); put('deptChart',deptChartHTML()); }
  else if(pers(S.view)){
    var id=S.view,p=pers(id);
    put('pTiles',personTilesHTML(id)); put('pMonth',monthTableHTML(id)); put('pWeek',weekTableHTML(id));
    put('rowtot',p.role==='sales'?clientTotHTML(id):journalTotHTML(id));
    var g=document.getElementById('pGrid');
    if(g) inputMetrics(id).forEach(function(m){
      var e=g.querySelector('[data-tot="'+m.k+'"]'),c=monthCell(id,m);
      if(e) e.innerHTML=fmt(c.f,m.money)+(m.agg==='avg'?' <span class="sub">ср.</span>':'');
    });
  }
}
function isEditing(){ var a=document.activeElement;
  return a&&(a.tagName==='INPUT'||a.tagName==='SELECT')&&document.getElementById('main').contains(a); }
function scheduleRebuild(){ if(isEditing()){ pendingRebuild=true; refresh(); } else { pendingRebuild=false; rebuild(); } }

/* ───────────── события ───────────── */
function parseNum(v){ v=String(v).replace(/\s/g,'').replace(',','.').replace(/[^0-9.\-]/g,''); return v===''?'':(isNaN(+v)?'':+v); }
document.addEventListener('focusout',function(){ setTimeout(function(){ if(pendingRebuild&&!isEditing()){ pendingRebuild=false; rebuild(); } },0); });
document.getElementById('main').addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.cell){
    var id=t.dataset.p,k=t.dataset.k,day=+t.dataset.d,d=D(id);
    if(!d.daily[day]) d.daily[day]={};
    var v=parseNum(t.value);
    if(v==='') delete d.daily[day][k]; else d.daily[day][k]=v;
    if(!Object.keys(d.daily[day]).length) delete d.daily[day];
    markSave(id); refresh(); return;
  }
  if(t.dataset.row){
    var pid=t.dataset.p,arr=t.dataset.kind==='c'?D(pid).clients:D(pid).journal,i=+t.dataset.i,f=t.dataset.f;
    if(!arr[i]) return;
    arr[i][f]=(f==='rev'||f==='cost'||f==='d')?parseNum(t.value):t.value;
    markSave(pid); refresh();
    if(t.dataset.kind==='c'){ var tr=t.closest('tr'); if(tr){ var mg=(+arr[i].rev||0)-(+arr[i].cost||0),c=tr.children[4];
      if(c){ c.textContent=fmt(mg,1); c.style.color=mg<0?'var(--bad)':'inherit'; } } }
    return;
  }
  if(t.dataset.plan){
    var pd=D(t.dataset.p); pd.plan[t.dataset.k]=parseNum(t.value);
    if(pd.plan[t.dataset.k]==='') delete pd.plan[t.dataset.k];
    markSave(t.dataset.p); refresh(); return;
  }
  if(t.dataset.lg){ var pl=people()[+t.dataset.i]; if(pl) pl.login=t.value.trim(); return; }
  if(t.dataset.pp){
    var pp=people()[+t.dataset.i]; if(!pp) return;
    if(t.dataset.f==='margin'){ pp.plan=pp.plan||{}; var mv=parseNum(t.value);
      if(mv==='') delete pp.plan.margin; else pp.plan.margin=mv; }
    else pp[t.dataset.f]=t.value;
    saveRoster(); return;
  }
});
document.getElementById('main').addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.pp&&t.dataset.f==='role'){ pendingRebuild=true; setTimeout(function(){ rebuild(); },0); return; }
  if(t.dataset.lg){ saveLogins(); return; }
  if(t.dataset.adm){
    var pa=people()[+t.dataset.i]; if(pa){ pa.admin=(t.value==='1'); saveLogins(); }
    return;
  }
});
document.getElementById('main').addEventListener('click',function(e){
  var g=e.target.closest('[data-goto]');
  if(g){ e.preventDefault(); S.view=g.dataset.goto; ls('view',S.view); rebuild(); window.scrollTo(0,0); return; }
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.dataset.act,id=b.dataset.p,i=+b.dataset.i;
  if(a==='addc'){ D(id).clients.push({d:1,name:'',rev:'',cost:''}); markSave(id); rebuild(); focusLast('pRows'); }
  else if(a==='delc'){ D(id).clients.splice(i,1); markSave(id); rebuild(); }
  else if(a==='addj'){ D(id).journal.push({d:1,c:'',l:'',t:'call'}); markSave(id); rebuild(); focusLast('pRows'); }
  else if(a==='delj'){ D(id).journal.splice(i,1); markSave(id); rebuild(); }
  else if(a==='planbase'){ var p=pers(id); p.plan=Object.assign({},p.plan||{},D(id).plan||{}); saveRoster(); rebuild(); }
  else if(a==='planreset'){ D(id).plan={}; markSave(id); rebuild(); }
  else if(a==='addp'){ S.roster=people().concat([{id:'p'+Date.now().toString(36),name:'Новый сотрудник',role:'sales',plan:{}}]); saveRoster(); rebuild(); }
  else if(a==='delp'){ var rm=people()[i]; S.roster=people().filter(function(x,n){return n!==i;}); if(S.view===rm.id) S.view='dept'; saveRoster(); rebuild(); }
  else if(a==='up'&&i>0){ var r=people().slice(),t=r[i-1]; r[i-1]=r[i]; r[i]=t; S.roster=r; saveRoster(); rebuild(); }
  else if(a==='pw'){ setPassword(i); }
  else if(a==='mypw'){ changeOwnPassword(); }
  else if(a==='copyplans') copyPlans();
  else if(a==='theme'){ var th=b.dataset.t; ls('theme',th);
    if(th==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',th);
    rebuild(); }
  else if(a==='copytxt') copySummary(b);
});
function focusLast(cid){ var c=document.getElementById(cid); if(!c)return;
  var rows=c.querySelectorAll('#rows tr'); if(!rows.length)return;
  var inp=rows[rows.length-1].querySelector('input.txt'); if(inp) inp.focus(); }
function copyPlans(){
  var prev=shiftM(S.month,-1),n=0;
  setStatus('saving','переношу планы');
  api('state&month='+prev).then(function(j){
    var docs=j.docs||{};
    people().forEach(function(p){
      var pl=(docs[p.id]||{}).plan||{};
      if(Object.keys(pl).length&&canEdit(p.id)){ D(p.id).plan=JSON.parse(JSON.stringify(pl)); markSave(p.id); n++; }
    });
    rebuild(); setStatus('saved',n?('перенесено: '+n):'в прошлом месяце планов нет');
  },function(){ setStatus('err','не получилось'); });
}
function copySummary(btn){
  var t=deptTotals(),L=[];
  L.push('РНП отдела продаж · '+monthLabel(S.month));
  L.push('Маржа: '+fmt(t.margin,1)+' из '+fmt(t.mplan,1)+' ₽ ('+pctTxt(t.mplan>0?t.margin/t.mplan:null)+')');
  L.push('Поступления: '+fmt(t.rev,1)+' ₽ · себестоимость: '+fmt(t.cost,1)+' ₽');
  L.push('Оплат: '+fmt(t.pay)+' · выставлено счетов: '+fmt(t.inv));
  if(leadIds().length) L.push('Заявок от КЦ: '+fmt(t.req)+' из '+fmt(t.reqPlan));
  L.push('');
  var n=daysIn(S.month);
  salesIds().forEach(function(id){
    var pl=planOf(id).margin||0,f=aggr(series(id,'margin'),1,n,'sum');
    L.push(pers(id).name+': маржа '+fmt(f,1)+' / '+fmt(pl,1)+' ₽ ('+pctTxt(pl>0?f/pl:null)+'), оплат '+fmt(aggr(series(id,'payments'),1,n,'sum')));
  });
  var txt=L.join('\n');
  function done(ok){ btn.textContent=ok?'Скопировано':'Не вышло — выделите текст'; setTimeout(function(){btn.textContent='Скопировать сводку текстом';},2200); }
  try{ navigator.clipboard.writeText(txt).then(function(){done(true);},function(){ fallback(); }); }
  catch(e){ fallback(); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt;
    ta.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;height:140px;z-index:70';
    document.body.appendChild(ta); ta.select(); done(false);
    setTimeout(function(){ try{ta.remove();}catch(e){} },8000);
  }
}
document.getElementById('prev').onclick=function(){ setMonth(shiftM(S.month,-1)); };
document.getElementById('next').onclick=function(){ setMonth(shiftM(S.month,1)); };
document.getElementById('selM').onchange=function(){ setMonth(ym(+document.getElementById('selY').value,+this.value)); };
document.getElementById('selY').onchange=function(){ setMonth(ym(+this.value,+document.getElementById('selM').value)); };
function setMonth(m){ S.month=m; S.docs={}; S.ready=false; ls('month',m); rebuild(); if(ME) pull(); }
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('[data-v]'); if(!b)return;
  S.view=b.dataset.v; ls('view',S.view); rebuild(); window.scrollTo(0,0);
});

/* подсказки */
var tip=document.getElementById('tip');
document.addEventListener('mouseover',function(e){
  var t=e.target.closest('[data-tip]');
  if(!t){ tip.style.opacity=0; return; }
  tip.textContent=t.dataset.tip.replace(/\n/g,'\n'); tip.style.opacity=1;
});
document.addEventListener('mousemove',function(e){
  if(tip.style.opacity!=='1')return;
  var x=Math.min(e.clientX+12,window.innerWidth-250),y=Math.max(8,e.clientY-10);
  tip.style.left=x+'px'; tip.style.top=y+'px';
});

/* ───────────── запуск ───────────── */
(function initTheme(){ var t=ls('theme'); if(t&&t!=='auto') document.documentElement.setAttribute('data-theme',t); })();
(function initPrefs(){ var m=ls('month'); if(m&&/^\d{4}-\d{2}$/.test(m)) S.month=m; var v=ls('view'); if(v) S.view=v; })();
rebuild();

var started=false;
var gateEl=document.getElementById('gate'),whoEl=document.getElementById('who'),soEl=document.getElementById('signout');
function gateCard(title,body,actions){
  return '<div class="gate-card"><div class="brand" style="margin-bottom:16px"><b>РНП</b><span>НИИ АТТ · отдел продаж</span></div>'+
    '<h2>'+title+'</h2><div class="gate-txt">'+body+'</div>'+
    (actions?'<div class="row-acts" style="margin-top:18px">'+actions+'</div>':'')+'</div>';
}
function showGate(kind,extra){
  var h='';
  if(kind==='login'){
    h=gateCard('Вход в РНП отдела продаж',
      '<p>Логин и пароль выдаёт администратор отдела.</p>'+
      '<div style="margin-top:14px;display:grid;gap:9px;max-width:300px">'+
      '<input id="lg" class="inp" type="text" autocomplete="username" placeholder="логин" style="width:100%">'+
      '<input id="pw" class="inp" type="password" autocomplete="current-password" placeholder="пароль" style="width:100%">'+
      '</div><p id="lgerr" style="color:var(--bad);margin:10px 0 0;min-height:18px"></p>',
      '<button class="btn p" data-g="in">Войти</button>');
  } else if(kind==='setup'){
    h=gateCard('Первый запуск',
      '<p>В базе пока никого нет. Заведи себя — это будет администратор: сможет добавлять сотрудников, выдавать логины и заполнять любую вкладку.</p>'+
      '<div style="margin-top:14px;display:grid;gap:9px;max-width:300px">'+
      '<input id="snm" class="inp" type="text" placeholder="имя, например Данила" style="width:100%">'+
      '<input id="lg" class="inp" type="text" autocomplete="username" placeholder="логин латиницей" style="width:100%">'+
      '<input id="pw" class="inp" type="password" autocomplete="new-password" placeholder="пароль, минимум 6 знаков" style="width:100%">'+
      '</div><p id="lgerr" style="color:var(--bad);margin:10px 0 0;min-height:18px"></p>',
      '<button class="btn p" data-g="setup">Создать администратора</button>');
  } else {
    h=gateCard('Сервер не отвечает','<p>'+esc(extra||'Не удалось связаться с api.php. Проверь, что файл лежит рядом со страницей и у папки есть права на запись.')+'</p>',
      '<button class="btn" data-g="reload">Попробовать снова</button>');
  }
  gateEl.innerHTML=h; gateEl.hidden=false;
  var f=document.getElementById('snm')||document.getElementById('lg'); if(f) f.focus();
}
function gateErr(t){ var e=document.getElementById('lgerr'); if(e) e.textContent=t; }
function doLogin(){
  var lg=(document.getElementById('lg')||{}).value||'',pw=(document.getElementById('pw')||{}).value||'';
  if(!lg||!pw){ gateErr('Заполни оба поля'); return; }
  gateErr('');
  api('login',{login:lg,password:pw}).then(function(j){ ME=j.me; isAdmin=!!ME.admin; start(); },
    function(e){ gateErr(e&&e.error==='bad_credentials'?'Неверный логин или пароль':'Не получилось войти'); });
}
function doSetup(){
  var nm=(document.getElementById('snm')||{}).value||'',
      lg=(document.getElementById('lg')||{}).value||'',
      pw=(document.getElementById('pw')||{}).value||'';
  if(!nm||!lg||!pw){ gateErr('Заполни все поля'); return; }
  if(pw.length<6){ gateErr('Пароль короче шести знаков'); return; }
  gateErr('');
  api('setup',{name:nm,login:lg,password:pw}).then(function(j){ ME=j.me; isAdmin=true; start(); },
    function(e){ gateErr(e&&e.error==='already_set'?'База уже заведена, обнови страницу':'Не получилось создать'); });
}
gateEl.addEventListener('click',function(e){
  var b=e.target.closest('[data-g]'); if(!b)return;
  if(b.dataset.g==='in') doLogin();
  else if(b.dataset.g==='setup') doSetup();
  else if(b.dataset.g==='reload') location.reload();
});
gateEl.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(document.getElementById('snm')) doSetup(); else doLogin();
});
soEl.onclick=function(){ api('logout',{}).then(function(){ location.reload(); },function(){ location.reload(); }); };

function changeOwnPassword(){
  var box=document.getElementById('mypwbox'); if(!box) return;
  var a=box.querySelector('[data-f="old"]').value,b=box.querySelector('[data-f="new"]').value,
      msg=box.querySelector('.msg');
  if(!a||!b){ msg.textContent='Заполни оба поля'; return; }
  if(b.length<6){ msg.textContent='Новый пароль короче шести знаков'; return; }
  api('mypasswd',{old:a,password:b}).then(function(){ msg.style.color='var(--good)'; msg.textContent='Пароль изменён';
    box.querySelector('[data-f="old"]').value=''; box.querySelector('[data-f="new"]').value=''; },
    function(e){ msg.style.color='var(--bad)'; msg.textContent=(e&&e.error==='bad_credentials')?'Текущий пароль неверный':'Не получилось'; });
}

function start(){
  started=true; gateEl.hidden=true;
  whoEl.textContent=ME.name||ME.login; whoEl.hidden=false; soEl.hidden=false;
  setStatus('saving','загружаю');
  pull().then(function(){ startPoll(); });
}

(function boot(){
  api('whoami').then(function(j){
    if(j.setup){ showGate('setup'); return; }
    if(!j.me){ showGate('login'); return; }
    ME=j.me; isAdmin=!!ME.admin; start();
  },function(e){ showGate('error',e&&e.detail?('Ответ сервера: '+e.detail):null); });
})();
})();
</script>
