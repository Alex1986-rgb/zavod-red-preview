name: Аудит лишних файлов на проде

# ТОЛЬКО ДИАГНОСТИКА. Ничего не заливает и ничего не удаляет: rsync запускается
# с --dry-run, то есть физически не может изменить сервер.
#
# Зачем: деплой (deploy-site-ssh.yml и deploy-site-lftp.yml) работает БЕЗ --delete,
# поэтому всё, что когда-либо попадало на прод, остаётся там навсегда — даже если
# страницу переименовали или удалили из репозитория. Хуже того, .htaccess отдаёт
# каталог приоритетом над файлом: правило в строках 17-19 редиректит /path на /path/,
# если на сервере есть каталог path. То есть оставшийся от прежней версии сайта
# каталог /catalog/chervyachnye/ будет показываться вместо нового
# catalog/chervyachnye.html, и никакой деплой это не исправит.
#
# Этот воркфлоу собирает dist и печатает список того, что есть на сервере, но
# отсутствует в сборке. По этому списку принимается решение, что удалять руками.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install --quiet rcssmin rjsmin
      - run: python3 deploy/build-dist.py
      - name: Ключ и known_hosts
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "HOST=$HOST" >> $GITHUB_ENV
      - name: Что на проде лишнее (сухой прогон, без удаления)
        shell: bash {0}
        env:
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          BASE=$(printf '%s' "$SSH_USER" | tr -d '\r\n' | sed 's/[[:space:]]*$//' | sed 's/_[12]$//')
          DEST="/home/c/$BASE/public_html/"
          echo "цель: $BASE@$HOST:$DEST"
          echo "режим: СУХОЙ ПРОГОН — сервер не изменяется"
          # --delete только вместе с --dry-run: rsync лишь перечисляет кандидатов.
          # Серверные каталоги, которых нет и не должно быть в dist, исключены,
          # иначе они попадут в список как «лишние»: бэкенд CRM, загрузки, логи.
          rsync -rlnc --delete --dry-run --out-format='%o %n' \
            --exclude 'analog/' \
            --exclude 'api/' \
            --exclude 'admin/' \
            --exclude 'uploads/' \
            --exclude 'storage/' \
            --exclude 'logs/' \
            --exclude '.well-known/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no" \
            dist/ "$BASE@$HOST:$DEST" 2>&1 | grep '^del\.' | sed 's/^del\. //' > stale.txt
          grep -v '^_seo_backup\|^_lineup_backup\|^blog_backup\|^glossary_backup\|^sravnenie' stale.txt \
            > stale-real.txt || true
          # Итоги печатаем ПОСЛЕДНИМИ: в логе видно только хвост, и любой длинный
          # перечень выше вытесняет из него цифры.
          echo
          echo "================ ИТОГИ ================"
          echo "лишних объектов на проде всего: $(wc -l < stale.txt)"
          echo "из них вне бэкап-каталогов:     $(wc -l < stale-real.txt)"
          echo
          echo "--- вне бэкапов, по разделам ---"
          sed 's|/.*||' stale-real.txt | sort | uniq -c | sort -rn | head -18
          echo
          echo "--- генерируемые разделы: сколько лишних страниц и примеры ---"
          for d in tiporazmer ispolnenie motor-reduktor-zr glossary reduktor blog catalog brands; do
            n=$(grep -c "^$d/" stale-real.txt || true)
            printf '  %-20s %s\n' "$d" "$n"
            grep "^$d/" stale-real.txt | head -3 | sed 's/^/        /'
          done
          echo
          # Ключевой вопрос: откуда берётся переадресация наших адресов с подчёркиваниями
          # на старые с дефисами. В корневом .htaccess репозитория такого правила нет,
          # значит либо на сервере свой корневой файл, либо вложенные в разделах.
          echo "--- .htaccess вне корня (переопределяют правила раздела) ---"
          grep -i 'htaccess' stale.txt | head -20 || echo "  нет"
          echo
          echo "--- резервные копии файлов на проде (.bak/.orig/.old) ---"
          printf '  всего: %s\n' "$(grep -cE '\.(bak|orig|old)' stale.txt || true)"
          grep -E '\.(bak|orig|old)' stale.txt | head -8 | sed 's/^/    /'
      - name: Боевой .htaccess против репозитория
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        env:
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          # Только чтение. На сервере действуют правила, которых нет в репозитории:
          # наши адреса с подчёркиваниями переадресуются на адреса с дефисами, а рядом
          # лежит копия .htaccess.bak-underscore. Надо увидеть, что там добавлено, иначе
          # ближайшая выкатка перезапишет файл и полезное уедет вместе с вредным.
          #
          # Печатается не файл целиком, а построчная разница с нашим; строки со словами
          # password/secret/token/key/auth маскируются — лог остаётся в GitHub.
          BASE=$(printf '%s' "$SSH_USER" | tr -d '\r\n' | sed 's/[[:space:]]*$//' | sed 's/_[12]$//')
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=no \
            "$BASE@$HOST" 'cat ~/public_html/.htaccess' > /tmp/prod.htaccess 2>/dev/null
          echo "боевой .htaccess: $(wc -l < /tmp/prod.htaccess) строк, $(wc -c < /tmp/prod.htaccess) байт"
          echo "наш .htaccess:    $(wc -l < .htaccess) строк, $(wc -c < .htaccess) байт"
          mask() { sed -E 's/^(.*(pass|secret|token|key|auth).*)$/[строка скрыта: может содержать доступы]/I'; }
          echo
          echo "=== правила про подчёркивания на проде ==="
          grep -nE '_' /tmp/prod.htaccess | grep -iE 'rewrite|redirect' | mask | head -20 \
            || echo "  таких правил нет"
          echo
          echo "=== ЕСТЬ У НАС, НЕТ НА ПРОДЕ (наши правки не доехали) ==="
          comm -23 <(sort -u .htaccess) <(sort -u /tmp/prod.htaccess) | grep -v '^\s*$' | mask | head -30
          echo
          echo "=== ЕСТЬ НА ПРОДЕ, НЕТ У НАС (сотрутся при выкатке) ==="
          comm -13 <(sort -u .htaccess) <(sort -u /tmp/prod.htaccess) | grep -v '^\s*$' | mask | head -50
          echo
          # Боевой файл нужен целиком и в исходном порядке: правила mod_rewrite зависят
          # от порядка, по отсортированной разнице его не восстановить. Переносим в
          # репозиторий, чтобы выкатка больше не могла его стереть.
          # Файл нужен целиком и байт в байт: в mod_rewrite порядок правил определяет
          # поведение, по отсортированной разнице его не восстановить. В лог видно только
          # хвост, поэтому отдаём одним сжатым блоком последним, что печатает шаг.
          # Секретов в .htaccess нет — это правила переадресации и заголовки; маскирование
          # выше срабатывало на «mod_authz_core», а не на доступах.
          echo "=== БОЕВОЙ .htaccess, сжатый блок для переноса в репозиторий ==="
          printf '  строк %s, байт %s, sha256 %s\n' \
            "$(wc -l < /tmp/prod.htaccess)" "$(wc -c < /tmp/prod.htaccess)" \
            "$(sha256sum /tmp/prod.htaccess | cut -c1-16)"
          echo "--8<-- BASE64 НАЧАЛО --8<--"
          gzip -9 -c /tmp/prod.htaccess | base64 -w 200
          echo "--8<-- BASE64 КОНЕЦ --8<--"

      - uses: actions/upload-artifact@v4
        with:
          name: stale-on-prod
          path: stale.txt
