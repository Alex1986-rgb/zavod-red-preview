name: Deploy to Timeweb (FTP)
on:
  workflow_dispatch: {}
# ВНИМАНИЕ: FTP-Deploy-Action на аккаунте Timeweb зависает на объёме (>700 файлов, 3ч+ и падает).
# Штатная заливка идёт через deploy-site-lftp.yml (параллельный lftp). Этот воркфлоу — только вручную.
concurrency:
  group: site-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 deploy/build-dist.py
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./dist/
          exclude: |
            **/api/**
            **/admin/**
            **/crm-data/**
            **/migrations/**
