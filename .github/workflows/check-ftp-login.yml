name: Проверка FTP-пароля
# Проверяет, подходит ли пара логин/пароль из секретов. Ничего не заливает.
# Логин и пароль целиком НЕ печатаются — только маска, чтобы сверить с панелью.
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Что лежит в секретах (маской)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          mask() { printf '%s' "$1" | sed -E 's/^(.{2}).*(.{1})$/\1***\2/'; }
          echo "хост:   $(mask "$FTP_HOST")   (длина ${#FTP_HOST})"
          echo "логин:  $(mask "$FTP_USER")   (длина ${#FTP_USER})"
          echo "пароль: длина ${#FTP_PASS} символов"
          case "$FTP_PASS" in *" "*) echo "!! в пароле есть ПРОБЕЛ — частая причина отказа";; esac
          case "$FTP_USER" in *" "*) echo "!! в логине есть ПРОБЕЛ";; esac
          printf '%s' "$FTP_PASS" | grep -q $'\r\|\n' && echo "!! в пароле перевод строки — скопировался лишний символ" || true
      - name: Вход обычным FTP (как в боевом деплое)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          out=$(timeout 60 lftp -c "set ftp:ssl-allow no; set net:timeout 15; set net:max-retries 1; \
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"ftp://$FTP_HOST\"; cls -1 /public_html/ | head -5;" 2>&1)
          code=$?
          echo "$out" | grep -v "^$" | head -8
          if echo "$out" | grep -q "530"; then
            echo "==> ПАРОЛЬ ИЛИ ЛОГИН НЕ ПОДХОДЯТ (530)"; exit 1
          elif [ $code -eq 0 ]; then
            echo "==> ДОСТУП ЕСТЬ — вход выполнен, каталог прочитан"
          else
            echo "==> Вход не удался, но не по паролю (код $code)"; exit 1
          fi
