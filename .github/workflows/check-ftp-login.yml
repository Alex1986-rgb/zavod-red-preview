name: Проверка FTP-пароля
# Пробует пароль из секрета против всех кандидатов-логинов. Ничего не заливает.
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Перебор логинов с одним паролем
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          FTP_HOST=$(printf '%s' "$FTP_HOST" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          FTP_PASS=$(printf '%s' "$FTP_PASS" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          base=$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/[[:space:]]*$//' | sed 's/_[12]$//')
          echo "база логина: длина ${#base}   пароль: длина ${#FTP_PASS}"
          any_ok=0
          for u in "$base" "${base}_1" "${base}_2"; do
            out=$(timeout 40 lftp -c "set ftp:ssl-allow no; set net:timeout 12; set net:max-retries 1; \
              open -u \"$u\",\"$FTP_PASS\" \"ftp://$FTP_HOST\"; pwd; cls -1 / | head -3;" 2>&1)
            if echo "$out" | grep -q "530"; then
              echo "  $u : 530 — не подходит"
            elif echo "$out" | grep -qi "login\|fatal\|error"; then
              echo "  $u : ошибка не по паролю — $(echo "$out" | head -1)"
            else
              echo "  $u : ✅ ВХОД ЕСТЬ"
              echo "$out" | grep -v "^$" | head -4 | sed 's/^/       /'
              any_ok=1
            fi
          done
          echo "-----"
          [ $any_ok -eq 1 ] && echo "==> НАЙДЕН рабочий логин (см. ✅ выше)" || echo "==> НИ ОДИН логин не подошёл к этому паролю — значит неверен ПАРОЛЬ"
