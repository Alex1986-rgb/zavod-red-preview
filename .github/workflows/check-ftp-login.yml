name: Проверка FTP-пароля
# Быстрая проверка: подходит ли текущий секрет FTP_PASSWORD. Ничего не заливает —
# только логинится и читает список файлов. Нужна, чтобы не гонять 15-минутный
# деплой ради того, чтобы узнать «530 Login incorrect».
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Вход обычным FTP (как в боевом деплое)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          out=$(timeout 60 lftp -c "set ftp:ssl-allow no; set net:timeout 15; set net:max-retries 1; \
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"ftp://$FTP_HOST\"; cls -1 /public_html/ | head -5;" 2>&1)
          code=$?
          echo "$out" | grep -v "^$" | head -8
          if echo "$out" | grep -q "530"; then
            echo "==> ПАРОЛЬ НЕ ПОДХОДИТ (530 Login incorrect)"; exit 1
          elif [ $code -eq 0 ]; then
            echo "==> ПАРОЛЬ ВЕРНЫЙ — вход выполнен, каталог прочитан"
          else
            echo "==> Вход не удался, но не по паролю (код $code)"; exit 1
          fi
