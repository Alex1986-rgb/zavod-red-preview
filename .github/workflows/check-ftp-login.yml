name: Проверка FTP-пароля
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Проверить доступ к папке сайта
        shell: bash {0}
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          FTP_HOST=$(printf '%s' "$FTP_HOST" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          FTP_USER=$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          FTP_PASS=$(printf '%s' "$FTP_PASS" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          echo "логин: $FTP_USER"
          echo "=== домашняя папка ==="
          lftp -c "set ftp:ssl-allow no; set net:timeout 15; open -u \"$FTP_USER\",\"$FTP_PASS\" \"ftp://$FTP_HOST\"; pwd; cls -1 / | head -20;" 2>&1 | grep -v "^$" | head -22
          echo "=== пробуем /public_html/ (сюда льёт деплой) ==="
          out=$(lftp -c "set ftp:ssl-allow no; set net:timeout 15; open -u \"$FTP_USER\",\"$FTP_PASS\" \"ftp://$FTP_HOST\"; cls -1 /public_html/ | head -12;" 2>&1)
          echo "$out" | grep -v "^$" | head -14
          if echo "$out" | grep -qiE "index|\.html|assets|catalog"; then
            echo "==> /public_html/ ДОСТУПЕН — деплой сработает как есть"
          elif echo "$out" | grep -qiE "no such|not found|access|550"; then
            echo "==> /public_html/ НЕ виден этому пользователю — нужен другой путь"
          else
            echo "==> неоднозначно, см. вывод выше"
          fi
