# Выкладка точечных правок на боевой сайт (Beget, ~/zavod-red.ru/public_html), с согласия владельца 09.10.2026:
#   tools/livefix/patch.py  — вёрстка (мобильная панель, крошки, таблицы, карточки);
#   tools/seo1920/patch.py  — title/description под запросы + sitemap lastmod + IndexNow.
# Перед правкой — копия в ~/_archive_old/. Оба скрипта идемпотентны: повторный запуск ничего не ломает.
# Запуск: коммит tools/livefix/request.txt.
name: livefix

on:
  push:
    branches: [claude/greeting-check-in-gdeerr]
    paths: ['tools/livefix/request.txt']

permissions:
  contents: read

concurrency:
  group: livefix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /tools/livefix/
            /tools/seo1920/
          sparse-checkout-cone-mode: false
      - name: Ключ
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '\r\n'); BASE=$(printf '%s' "$SSH_USER" | tr -d '\r\n' | sed 's/_[12]$//')
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -t ed25519,rsa "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "HOST=$HOST" >> $GITHUB_ENV; echo "BASE=$BASE" >> $GITHUB_ENV
      - name: Применить на сервере
        shell: bash
        run: |
          set -euo pipefail
          SSHO="-i $HOME/.ssh/id_ed25519 -o BatchMode=yes"
          ssh $SSHO "$BASE@$HOST" "mkdir -p ~/_deploy_tmp/livefix"
          scp $SSHO tools/livefix/patch.py "$BASE@$HOST:_deploy_tmp/livefix/layout.py"
          scp $SSHO tools/seo1920/patch.py "$BASE@$HOST:_deploy_tmp/livefix/seo.py"
          scp $SSHO tools/seo1920/titles2.py "$BASE@$HOST:_deploy_tmp/livefix/titles2.py"
          scp $SSHO tools/seo1920/ads3.py "$BASE@$HOST:_deploy_tmp/livefix/ads3.py"
          scp $SSHO tools/seo1920/ads4.py "$BASE@$HOST:_deploy_tmp/livefix/ads4.py"
          scp $SSHO tools/seo1920/ads5.py "$BASE@$HOST:_deploy_tmp/livefix/ads5.py"
          scp $SSHO tools/seo1920/ads6.py "$BASE@$HOST:_deploy_tmp/livefix/ads6.py"
          scp $SSHO tools/formfix/form.css tools/formfix/patch.py tools/formfix/indexfaq.py "$BASE@$HOST:_deploy_tmp/livefix/"
          ssh $SSHO "$BASE@$HOST" 'bash -s' <<'EOS'
          set -euo pipefail
          R=~/zavod-red.ru/public_html
          TS=$(date +%Y%m%d-%H%M%S)
          B=~/_archive_old/livefix-$TS
          mkdir -p $B/assets
          cp -p $R/assets/modal.js $R/assets/inner.css $R/assets/hdr.css $B/assets/
          echo "python: $(python3 --version)"
          echo "=== ВЁРСТКА ==="
          python3 ~/_deploy_tmp/livefix/layout.py $R
          echo "Откат вёрстки: cp -p $B/assets/* $R/assets/"
          echo "=== SEO ==="
          python3 ~/_deploy_tmp/livefix/seo.py $R --apply
          echo "=== ЦИФРЫ В ЗАГОЛОВКАХ ==="
          python3 ~/_deploy_tmp/livefix/titles2.py $R --apply
          echo "=== ОПИСАНИЯ ПОД КЛЮЧИ РЕКЛАМЫ ==="
          # Разовый откат первой версии ads3 (затёрла полезные описания серий) — один раз, по метке.
          RB=~/_archive_old/ads3-20261010-151304
          if [ -d "$RB/brands" ] && [ ! -f "$RB/.restored" ]; then cp -p "$RB"/brands/*.html "$R/brands/" && touch "$RB/.restored" && echo "откат ads3 v1: $(ls "$RB"/brands | wc -l) стр."; fi
          python3 ~/_deploy_tmp/livefix/ads3.py $R --apply
          echo "=== КАТАЛОГ ПОД ОБЩИЕ ЗАПРОСЫ КОНКУРЕНТА ==="
          python3 ~/_deploy_tmp/livefix/ads4.py $R --apply
          echo "=== ХАБЫ МОДЕЛЕЙ analog/ ==="
          python3 ~/_deploy_tmp/livefix/ads5.py $R --apply
          echo "=== ЗАПРОСЫ В ТЕКСТ: ЧАСТЫЕ ВОПРОСЫ ==="
          python3 ~/_deploy_tmp/livefix/ads6.py $R --apply
          echo "=== ФОРМА ЗАЯВКИ + FAQ ГЛАВНОЙ ==="
          cp -p $R/assets/hdr.css $B/assets/hdr.css.before-form
          python3 ~/_deploy_tmp/livefix/patch.py $R ~/_deploy_tmp/livefix/form.css
          python3 ~/_deploy_tmp/livefix/indexfaq.py $R --apply
          rm -rf ~/_deploy_tmp/livefix
          EOS
      - name: Проверка на живом сайте
        shell: bash
        run: |
          N=$(date +%s)
          curl -sS "https://zavod-red.ru/assets/modal.js?n=$N" -o modal.js && node --check modal.js && echo "modal.js: синтаксис OK"
          for f in assets/modal.js assets/inner.css assets/hdr.css; do printf '%s LIVEFIX-0910: ' "$f"; curl -sS "https://zavod-red.ru/$f?n=$N" | grep -c LIVEFIX-0910 || true; done
          for u in "" about catalog/pr catalog/mr brands/sew brands/sew-r brands/sew-k brands/sew-w brands/bonfiglioli-vf brands/nord brands/siti-bh brands/lenze-gfl brands/flender brands/bonfiglioli brands/sew brands/tramec-k brands/vemper-mrv; do
            printf '%-24s %s  ' "/$u" "$(curl -sS -o /dev/null -w '%{http_code}' "https://zavod-red.ru/$u?n=$N")"
            curl -sS "https://zavod-red.ru/$u?n=$N" | grep -o '<title>[^<]*</title>' | head -1
          done
          for u in analog/sew-r-77 analog/bonfiglioli-vf-49 analog/motovario-nmrv-050 analog/siti-mu-50 analog/nord-sk-72; do printf '%-30s ' "/$u"; curl -sS "https://zavod-red.ru/$u?n=$N" | grep -o '<title>[^<]*</title>' | head -1; done
          for u in catalog catalog/motor-reduktory catalog/motor-reduktory-380v catalog/pr catalog/evl podbor; do printf '%-28s ' "/$u"; curl -sS "https://zavod-red.ru/$u?n=$N" | grep -o '<title>[^<]*</title>' | head -1; done
          for u in brands/sew-r brands/lenze brands/tramec-xc; do printf '%-20s ' "/$u"; curl -sS "https://zavod-red.ru/$u?n=$N" | grep -o '<meta name="description" content="[^"]*"' | head -1; done
          for u in "" brands/sew catalog/motor-reduktory podbor; do printf '%-26s FAQ ads6: ' "/$u"; curl -sS "https://zavod-red.ru/$u?n=$N" | grep -c 'ads6' || true; done
          printf 'hdr.css LIVEFIX-FORM: '; curl -sS "https://zavod-red.ru/assets/hdr.css?n=$N" | grep -c LIVEFIX-FORM || true
          printf 'главная: вопросы в родном FAQ: '; curl -sS "https://zavod-red.ru/?n=$N" | grep -o '<!-- ads6 --><div class="faq-item">' | wc -l
          printf 'главная: голая секция осталась: '; curl -sS "https://zavod-red.ru/?n=$N" | grep -c '<div class="wrap"><!-- ads6 -->' || true
          printf 'IndexNow key: '; curl -sS -o /dev/null -w '%{http_code}\n' https://zavod-red.ru/051a8bb09331b03c5e35d4a40339b5b3.txt
