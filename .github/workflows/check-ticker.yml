name: Проверить ленту в шапке в настоящем браузере

# ТОЛЬКО ЧТЕНИЕ боевого сайта. Секреты не используются.
#
# Зачем отдельный воркфлоу. Разметка, стили и скрипт на боевом на месте — это уже
# проверено запросами. Но заказчик ленты не видит, а запрос показывает исходный HTML,
# а не то, что получилось после выполнения скрипта. Значит смотреть надо в браузере:
# есть ли элемент в DOM, какого он размера, и не упал ли скрипт с ошибкой.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Поставить браузер
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@latest >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Открыть страницы боевого и посмотреть, что вышло
        run: |
          cat > check.mjs <<'JS'
          import { chromium } from 'playwright';
          const S = 'https://zavod-red.ru';
          const PAGES = ['/catalog/', '/brands/sew', '/about', '/podbor', '/'];
          const b = await chromium.launch();
          for (const p of PAGES) {
            const ctx = await b.newContext({ viewport: { width: 1280, height: 900 } });
            const pg = await ctx.newPage();
            const errs = [], fails = [];
            pg.on('pageerror', e => errs.push(String(e).slice(0, 220)));
            pg.on('requestfailed', r => fails.push(r.url().split('/').pop() + ' ' + (r.failure()?.errorText || '')));
            pg.on('response', r => { if (r.status() >= 400) fails.push(r.status() + ' ' + r.url()); });
            try {
              await pg.goto(S + p, { waitUntil: 'networkidle', timeout: 45000 });
            } catch (e) { console.log(`  ${p}  НЕ ЗАГРУЗИЛАСЬ: ${e.message.slice(0,90)}`); await ctx.close(); continue; }
            await pg.waitForTimeout(1200);
            const r = await pg.evaluate(() => {
              const t = document.querySelector('.zr-tick');
              const old = document.querySelector('.brand-ticker');
              const hdr = document.querySelector('header');
              const box = t ? t.getBoundingClientRect() : null;
              const st = t ? getComputedStyle(t) : null;
              const imgs = t ? [...t.querySelectorAll('img')] : [];
              return {
                есть_zr_tick: !!t,
                есть_старая_лента: !!old,
                есть_header: !!hdr,
                размер: box ? Math.round(box.width) + 'x' + Math.round(box.height) : '—',
                display: st ? st.display : '—',
                visibility: st ? st.visibility : '—',
                картинок: imgs.length,
                загрузилось_картинок: imgs.filter(i => i.complete && i.naturalWidth > 0).length,
                первая_картинка: imgs[0] ? imgs[0].getAttribute('src') : '—',
                modal_js: [...document.scripts].map(s => s.src).filter(s => s.includes('modal.js'))[0] || '—',
                hdr_css: [...document.styleSheets].map(s => s.href).filter(Boolean).filter(h => h.includes('hdr.css'))[0] || '—',
                правил_zr_tick: (() => { let n = 0; for (const s of document.styleSheets) { try { for (const r of s.cssRules) if (r.cssText && r.cssText.includes('zr-tick')) n++; } catch (e) {} } return n; })(),
              };
            });
            console.log(`\n=== ${p} ===`);
            for (const [k, v] of Object.entries(r)) console.log(`   ${k.padEnd(22)} ${v}`);
            console.log(`   ошибок JS             ${errs.length ? errs.join(' | ') : 'нет'}`);
            console.log(`   неудачных запросов    ${fails.length ? fails.slice(0,4).join(' | ') : 'нет'}`);
            await ctx.close();
          }
          await b.close();
          JS
          node check.mjs
