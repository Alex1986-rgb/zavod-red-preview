name: Диагностика приёма заявок на проде (только чтение)

# Временно, из ветки claude/greeting-check-in-gdeerr. По FTP (тем же доступом, что
# аудиты прода) ТОЛЬКО читает: журнал попыток приёма заявок crm-data/lead_attempts.jsonl,
# логи ошибок PHP, версии файлов приёмника. Ничего не пишет и не деплоит, заявок не создаёт.
# Контакты из журнала в выводе маскируются. Запуск: коммит файла tools/diag/request.txt.
on:
  push:
    branches: [claude/greeting-check-in-gdeerr]
    paths: ['tools/diag/request.txt']

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
      - name: Приёмник снаружи
        run: |
          curl -s -m 20 -o body.txt -w 'GET /api/feedback.php: HTTP %{http_code}, %{time_total}s\n' https://zavod-red.ru/api/feedback.php; head -c 200 body.txt; echo
      - name: Сервер по FTP — только чтение
        shell: bash {0}
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          FTP_HOST=$(printf '%s' "$FTP_HOST" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          FTP_USER=$(printf '%s' "$FTP_USER" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          FTP_PASS=$(printf '%s' "$FTP_PASS" | tr -d '\r\n' | sed 's/[[:space:]]*$//')
          L() { lftp -c "set ftp:ssl-allow no; set net:timeout 20; set net:max-retries 2; open -u \"$FTP_USER\",\"$FTP_PASS\" \"ftp://$FTP_HOST\"; $1" 2>&1; }
          mkdir -p srv
          echo "=== /public_html/api ==="; L "cls -l /public_html/api/ | head -40" | grep -v '^$'
          echo "=== /public_html/crm-data ==="; L "cls -l /public_html/crm-data/ | head -20" | grep -v '^$'
          L "get -O srv /public_html/api/feedback.php; get -O srv /public_html/api/helpers.php; get -O srv /public_html/api/db.php; get -O srv /public_html/crm-data/lead_attempts.jsonl" | grep -v '^$'
          for f in /public_html/error_log /public_html/api/error_log /public_html/php_errors.log /public_html/crm-data/error.log; do L "get -O srv $f" >/dev/null 2>&1 && echo "лог скачан: $f"; done
          echo "=== md5 на сервере (в репозитории CRM: feedback a9ba902a…, helpers 7b660e97…, db 05bd777e…) ==="; (cd srv && md5sum feedback.php helpers.php db.php 2>/dev/null)
          echo "=== config на сервере ==="; L "cls -l /public_html/api/config.php /public_html/api/config.local.php" | grep -v '^$'
          A=srv/lead_attempts.jsonl
          if [ -s "$A" ]; then
            echo "=== журнал попыток: всего $(wc -l < $A) строк ==="
            echo "--- по исходам ---"; grep -o '"outcome":"[a-z_]*"' $A | sort | uniq -c
            echo "--- по дням (последние 30) ---"; grep -o '"created_at":"[0-9-]*' $A | cut -d'"' -f4 | sort | uniq -c | tail -30
            echo "--- причины отказов (топ) ---"; grep -o '"reason":"[^"]*"' $A | sort | uniq -c | sort -rn | head -12 | cut -c1-200
            echo "--- последние 25 записей (контакты скрыты) ---"
            tail -n 25 $A | sed -E 's/"name":"[^"]*"/"name":"*"/; s/"phone":"[^"]*"/"phone":"*"/; s/"email":"[^"]*"/"email":"*"/; s/"ua":"[^"]*"/"ua":"-"/; s/"ip":"[^"]*"/"ip":"-"/; s/"message":"([^"]{0,40})[^"]*"/"message":"\1…"/' | cut -c1-420
          else echo "журнал попыток не скачан или пуст"; fi
          for f in srv/error_log srv/php_errors.log srv/error.log; do [ -s "$f" ] && { echo "=== $f (последние 30) ==="; tail -n 30 "$f" | cut -c1-300; }; done
          rm -rf srv; true
