name: Аудит доступности лишнего на проде

# ТОЛЬКО ЧТЕНИЕ. Ничего не заливает и не удаляет: обычные GET-запросы к сайту,
# как у любого посетителя. Секреты не используются — все адреса публичные.
#
# Зачем: аудит файлов показал на сервере 22 946 посторонних объектов — копии сайта
# (_seo_backup_*, _lineup_backup_*, blog_backup, glossary_backup), служебные каталоги
# (.claude, .github, deploy, crm-data) и чей-то локальный путь Users/anton/...
# Само наличие файла на диске ещё не значит, что он отдаётся наружу: часть может быть
# закрыта .htaccess. Этот воркфлоу показывает, что именно реально открывается, —
# по этому списку и решается, что чистить в первую очередь.
#
# Вторая задача: подтвердить по боевому сайту, что выкаченные правки на месте.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Что открывается наружу
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          probe() {
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -L "$S$1")
            case "$code" in
              200) mark="ОТКРЫТО";;
              403|401) mark="закрыто";;
              404) mark="нет";;
              *) mark="код $code";;
            esac
            printf '  %-6s %-4s %s\n' "$code" "$mark" "$1"
          }
          echo "=== КОНТРОЛЬ (должно быть 200) ==="
          for p in / /catalog/ /podbor; do probe "$p"; done
          echo
          echo "=== ДАННЫЕ CRM (должно быть закрыто) ==="
          for p in /crm-data/ /crm-data/lead_attempts.jsonl /crm-data/kb.md \
                   /crm-data/analogs.csv /crm-data/site_series.json; do probe "$p"; done
          echo
          echo "=== СЛУЖЕБНОЕ (должно быть закрыто) ==="
          for p in /.claude/ /.github/workflows/deploy-site.yml /deploy/build-dist.py \
                   /tools/card_audit.py; do probe "$p"; done
          echo
          echo "=== КОПИИ САЙТА (дубли для поиска) ==="
          for p in /_seo_backup_20260812b/index.html /_seo_backup_20260812c/index.html \
                   /_lineup_backup_20260812/catalog/evl.html /blog_backup/ /glossary_backup/ \
                   /sravnenie/tehnoreduktor-ural.html \
                   "/Users/anton/Developer/projects/zavod-red.ru/prototype/"; do probe "$p"; done
          echo
          echo "=== ПРОЧЕЕ ==="
          for p in /original_images/logo-zavod.png /assets/media-db/ /yandex-market.yml; do probe "$p"; done

      - name: Логотип — почему размыт
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          mkdir -p /tmp/logo
          echo "=== что отдаёт сервер ==="
          for f in assets/zr_logo.webp assets/zr_logo_dark.webp zr_logo.webp \
                   original_images/logo-zavod.png original_images/logo.png \
                   assets/favicons/fav-512x512.png; do
            n=$(echo "$f" | tr '/' '_')
            code=$(curl -s -o "/tmp/logo/$n" -m 30 -w '%{http_code}' "$S/$f")
            sz=$(stat -c%s "/tmp/logo/$n" 2>/dev/null || echo 0)
            printf '  HTTP %-4s %-8s %s\n' "$code" "$sz" "$f"
            [ "$code" = "200" ] || rm -f "/tmp/logo/$n"
          done
          echo
          echo "=== размер в пикселях и способ сжатия ==="
          python3 - <<'PY'
          import glob, os
          def webp(d):
              i, w, h, chunks = 12, None, None, []
              while i < len(d) - 8:
                  tag = d[i:i+4].decode('latin1'); sz = int.from_bytes(d[i+4:i+8], 'little')
                  chunks.append(tag.strip())
                  if tag == 'VP8X':
                      w = int.from_bytes(d[i+12:i+15], 'little') + 1
                      h = int.from_bytes(d[i+15:i+18], 'little') + 1
                  elif tag == 'VP8 ' and w is None:
                      w = int.from_bytes(d[i+14:i+16], 'little') & 0x3FFF
                      h = int.from_bytes(d[i+16:i+18], 'little') & 0x3FFF
                  elif tag == 'VP8L' and w is None:
                      v = int.from_bytes(d[i+9:i+13], 'little')
                      w = (v & 0x3FFF) + 1; h = ((v >> 14) & 0x3FFF) + 1
                  i += 8 + sz + (sz & 1)
              kind = 'БЕЗ потерь' if 'VP8L' in chunks else ('С ПОТЕРЯМИ' if 'VP8' in chunks else '?')
              return f'{w}x{h} px, webp {kind}'
          def png(d):
              w = int.from_bytes(d[16:20], 'big'); h = int.from_bytes(d[20:24], 'big')
              return f'{w}x{h} px, png (без потерь)'
          for p in sorted(glob.glob('/tmp/logo/*')):
              d = open(p, 'rb').read()
              if not d: continue
              try:
                  t = webp(d) if d[:4] == b'RIFF' else (png(d) if d[:4] == b'\x89PNG' else f'неизвестный формат {d[:4]!r}')
              except Exception as e:
                  t = f'не разобрался: {e}'
              print(f'  {os.path.basename(p):34} {os.path.getsize(p):>8} б  {t}')
          PY
          echo
          echo "=== если на сервере лежит исходник крупнее — выводим его base64, чтобы забрать ==="
          for p in /tmp/logo/original_images_logo-zavod.png /tmp/logo/original_images_logo.png; do
            [ -f "$p" ] || continue
            sz=$(stat -c%s "$p")
            if [ "$sz" -gt 0 ] && [ "$sz" -lt 400000 ]; then
              echo "BASE64_BEGIN $(basename $p) $sz"
              base64 -w 200 "$p"
              echo "BASE64_END"
            else
              echo "  $(basename $p): $sz б — слишком велик для лога, заберём иначе"
            fi
          done

      - name: Стили на проде против репозитория
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          for f in assets/inner.css assets/hdr.css; do
            curl -s -o /tmp/prod.css -m 30 "$S/$f"
            a=$(sha256sum /tmp/prod.css | cut -c1-12)
            printf '  %-20s прод %s (%s б)\n' "$f" "$a" "$(stat -c%s /tmp/prod.css)"
            echo "    правила с логотипом на проде:"
            grep -o '[^{}]*\(logo\|sf-brand\)[^{}]*{[^}]*}' /tmp/prod.css | head -10 | sed 's/^/      /'
          done

      - name: Какого размера логотип рисуется на проде
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          pip install --quiet playwright >/dev/null 2>&1
          python3 -m playwright install --with-deps chromium >/dev/null 2>&1
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          S = 'https://zavod-red.ru'
          for path in ('/', '/analog/bauer-bk-20-i28-83-0-75kvt', '/brands/siemens'):
              with sync_playwright() as p:
                  b = p.chromium.launch()
                  pg = b.new_page(viewport={'width': 1440, 'height': 900}, device_scale_factor=2)
                  try:
                      pg.goto(S + path, wait_until='load', timeout=45000)
                  except Exception as e:
                      print(f'  {path}: не открылась — {str(e)[:90]}'); b.close(); continue
                  info = pg.eval_on_selector_all('img', '''els => els
                      .filter(e => /logo/i.test(e.currentSrc || e.src))
                      .map(e => {const r = e.getBoundingClientRect();
                        return {src: (e.currentSrc||e.src).split("/").pop(),
                                w: Math.round(r.width), h: Math.round(r.height),
                                nw: e.naturalWidth, nh: e.naturalHeight,
                                where: e.closest("footer") ? "подвал" : "шапка"};})''')
                  print(f'  {path}')
                  for i in info:
                      need = i['w'] * 2
                      mark = 'РАСТЯГИВАЕТСЯ' if i['nw'] < need else 'запаса хватает'
                      print(f'      {i["where"]:7} {i["src"]:22} на экране {i["w"]}x{i["h"]}  '
                            f'файл {i["nw"]}x{i["nh"]}  при DPR2 нужно {need}px — {mark}')
                  b.close()
          PY

      - name: Где лежит страница с таблицей серий SIMOGEAR
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          echo "=== кандидаты по адресу ==="
          for p in /brands/siemens /brands/siemens/c /brands/siemens-c /brands/siemens/ \
                   /analog/siemens-simogear-c /analog/siemens-c /catalog/siemens \
                   /blog/siemens-simogear-serii /siemens-simogear-c /brands/flender; do
            code=$(curl -s -o /tmp/p.html -m 25 -w '%{http_code}' -L "$S$p")
            hit=$(grep -c "Диапазон по каталогу" /tmp/p.html 2>/dev/null || echo 0)
            ser=$(grep -c "в ряду SIMOGEAR" /tmp/p.html 2>/dev/null || echo 0)
            printf '  %-34s HTTP %-4s таблица: %-4s «в ряду SIMOGEAR»: %s\n' \
              "$p" "$code" "$([ "$hit" -gt 0 ] && echo ЕСТЬ || echo нет)" \
              "$([ "$ser" -gt 0 ] && echo ЕСТЬ || echo нет)"
          done
          echo
          echo "=== что знают карты сайта про siemens/simogear/flender ==="
          for m in sitemap.xml sitemap-hub.xml sitemap-index.xml; do
            echo "  -- $m"
            curl -s -m 40 "$S/$m" | grep -io '<loc>[^<]*\(siemens\|simogear\|flender\)[^<]*</loc>' \
              | sed 's/^/    /' | head -15
          done

      - name: Долетели ли правки на боевой
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          has() {  # $1 url, $2 строка, $3 описание
            if curl -s -m 25 -L "$S$1" | grep -qF "$2"; then echo "  ЕСТЬ   $3"; else echo "  НЕТ    $3"; fi
          }
          echo "=== проверка по содержимому боевых файлов ==="
          has /assets/inner.css 'sf-brand img{content:url(zr_logo_dark.webp)}' 'тёмный логотип в подвале'
          has /              'kick'                       'запуск видео по действию пользователя'
          has /              'prefers-reduced-motion'     'условия показа видео'
          has /analog/bauer-bf-06-i10-42-0-12kvt 'minmax(0,1fr)' 'фикс горизонтальной прокрутки карточек'
          has /analog/bauer-bf-06-i10-42-0-12kvt 'br-bauer-'     'фото бренда вместо стока'
          has /blog/planetarnyj-reduktor-cena 'Цена на планетарный редуктор' 'новая статья по планетарным'
          has /blog/kupit-tos-znojmo 'Tos Znojmo' 'новые статьи по Tos Znojmo'
          has /blog/chervyachnyj-kpd 'КПД червячного редуктора' 'исправленные падежи в заголовках'
          echo
          echo "=== приёмник заявок жив? (только GET, заявки не создаём) ==="
          for f in /api/feedback.php /api/store.php /api/contact_click.php /spasibo; do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$S$f")
            printf '  %-26s HTTP %s\n' "$f" "$code"
          done
          echo
          echo "=== видео отдаётся? ==="
          for f in /assets/hero.mp4 /assets/video/zavod-2026.mp4; do
            out=$(curl -s -o /dev/null -m 25 -w 'HTTP %{http_code}, тип %{content_type}, байт %{size_download}' -r 0-1023 "$S$f")
            printf '  %-34s %s\n' "$f" "$out"
          done

      - name: Заявка, админка и Директ — живы ли
        timeout-minutes: 6
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          echo "=== 1. Приёмник заявок ==="
          printf '  GET  /api/feedback.php  → %s (ожидаем 405: принимает только POST)\n' \
            "$(curl -s -o /dev/null -m 25 -w '%{http_code}' "$S/api/feedback.php")"
          # Проба ловушкой для ботов: непустое поле work_email обрабатывается ДО валидации
          # и до записи в базу — endpoint отвечает success и НЕ создаёт заявку. Так весь
          # путь запроса проверяется вживую, не засоряя CRM тестовыми лидами.
          out=$(curl -s -m 30 -X POST "$S/api/feedback.php" \
                 -d 'work_email=probe@example.invalid' -w '\n[код %{http_code}, %{time_total}с]')
          printf '  POST с ловушкой (заявка НЕ создаётся):\n    %s\n' "$(echo "$out" | tr '\n' ' ')"
          echo
          echo "=== 2. Админка ==="
          for p in /admin/login.php /admin/ /admin/direct.php /admin/leads.php; do
            code=$(curl -s -o /dev/null -m 25 -w '%{http_code}' "$S$p")
            fin=$(curl -s -o /dev/null -m 25 -L -w '%{url_effective}' "$S$p")
            printf '  %-22s %s → %s\n' "$p" "$code" "${fin#$S}"
          done
          echo
          echo "=== 3. Яндекс.Директ в админке ==="
          # Без сессии endpoint обязан ответить отказом авторизации в JSON.
          # 500 означал бы поломку кода, пустой ответ — что PHP не отработал.
          for a in overview balance keywords; do
            body=$(curl -s -m 30 "$S/api/direct.php?action=$a&days=30")
            code=$(curl -s -o /dev/null -m 30 -w '%{http_code}' "$S/api/direct.php?action=$a&days=30")
            printf '  action=%-9s код %s  ответ: %s\n' "$a" "$code" "$(echo "$body" | head -c 160)"
          done
          echo
          echo "=== 4. Прочие приёмники ==="
          for f in /api/store.php /api/contact_click.php /api/helpers.php; do
            printf '  %-26s %s\n' "$f" "$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$S$f")"
          done

      - name: Проверка правок под целевые запросы
        timeout-minutes: 8
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          echo "=== ЗАГОЛОВКИ СТРАНИЦ БРЕНДОВ (ждём «Редукторы … (кириллица)») ==="
          for b in sew bonfiglioli nord motovario innovari lenze bauer siti varvel rossi keb siemens stm; do
            t=$(curl -s -m 25 -L "$S/brands/$b" | grep -o '<title>[^<]*' | head -1 | cut -c8-)
            printf '  %-12s %s\n' "$b" "${t:-НЕ ОТВЕТИЛА}"
          done

          echo
          echo "=== ЗАГОЛОВКИ ТИПОВЫХ ==="
          for u in ploskie variatory konichesko-cilindricheskie planetarnye cilindricheskie chervyachnye; do
            t=$(curl -s -m 25 -L "$S/catalog/$u" | grep -o '<title>[^<]*' | head -1 | cut -c8-)
            printf '  %-28s %s\n' "$u" "${t:-НЕ ОТВЕТИЛА}"
          done

          echo
          echo "=== АДРЕС, КОТОРЫЙ ОТДАВАЛ 404 ==="
          printf '  /brands/sew-eurodrive  HTTP %s\n' "$(curl -s -o /dev/null -m 25 -w '%{http_code}' "$S/brands/sew-eurodrive")"
          printf '  canonical: %s\n' "$(curl -s -m 25 -L "$S/brands/sew-eurodrive" | grep -o 'rel="canonical" href="[^"]*"' | head -1)"

          echo
          echo "=== ГОРОДА И КИРИЛЛИЦА НА БОЕВОМ ==="
          for b in sew nord keb; do
            h=$(curl -s -m 25 -L "$S/brands/$b")
            printf '  %-6s Ростов-на-Дону: %-3s  кириллица рядом с «Редукторы»: %s\n' "$b" \
              "$(echo "$h" | grep -c 'Ростов-на-Дону')" \
              "$(echo "$h" | grep -o 'Редукторы [А-ЯЁ][а-яёА-ЯЁ ]*' | head -1)"
          done

          echo
          echo "=== АНКОРЫ СКВОЗНОГО ФУТЕРА ==="
          curl -s -m 25 -L "$S/catalog/chervyachnye" \
            | grep -o '<a href="/catalog/[a-z-]*">[^<]*</a>' | tail -8 | sed 's/^/  /'

          echo
          echo "=== ТАБЛИЦА ЗАМЕН У KEB И SIEMENS ==="
          for b in keb siemens; do
            n=$(curl -s -m 25 -L "$S/brands/$b" | grep -c 'Замены .* → наш редуктор ZR')
            printf '  %-8s заголовок таблицы замен найден: %s\n' "$b" "$n"
          done

          echo
          echo "=== ХАБ В КАРТЕ САЙТА ==="
          printf '  /motor-reduktor-zr/ в sitemap.xml: %s\n' "$(curl -s -m 25 "$S/sitemap.xml" | grep -c 'motor-reduktor-zr/</loc>')"
          printf '  /motor-reduktor-zr/ HTTP %s\n' "$(curl -s -o /dev/null -m 25 -w '%{http_code}' -L "$S/motor-reduktor-zr/")"

      - name: Бегущая лента и полоса над шапкой на главной
        timeout-minutes: 5
        continue-on-error: true
        shell: bash {0}
        run: |
          S=https://zavod-red.ru
          H=$(curl -s -m 30 -L "$S/")
          printf 'размер главной: %s байт\n' "$(printf '%s' "$H" | wc -c)"
          echo
          echo "=== ЧТО ДОЛЖНО БЫТЬ НА ГЛАВНОЙ ==="
          for k in brand-ticker bt-track bt-scroll topbar tb-note hdr2 "Собственное производство"; do
            printf '  %-26s вхождений: %s\n' "$k" "$(printf '%s' "$H" | grep -c -- "$k")"
          done
          echo
          echo "=== ЛОГОТИПОВ В ЛЕНТЕ ==="
          printf '  img внутри brand-ticker: %s\n' \
            "$(printf '%s' "$H" | tr '>' '>\n' | sed -n '/brand-ticker/,/<\/section/p' | grep -c '<img')"
          echo
          echo "=== СЕКЦИИ ГЛАВНОЙ ==="
          printf '  всего <section: %s\n' "$(printf '%s' "$H" | grep -c '<section')"
          printf '  id секций: %s\n' "$(printf '%s' "$H" | grep -o 'id="[a-z-]*"' | sort -u | tr '\n' ' ')"
          echo
          echo "=== КЭШ ГЛАВНОЙ (почему может показываться старое) ==="
          curl -s -I -m 20 "$S/" | grep -i 'cache-control\|etag\|last-modified\|age' | sed 's/^/  /'
