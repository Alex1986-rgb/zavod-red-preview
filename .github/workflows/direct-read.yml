# ТОЛЬКО ЧТЕНИЕ: ключи, объявления, поисковые запросы Яндекс.Директа и список конкурентов из CRM
# (прямая просьба владельца 10.10.2026; репозиторий приватный). Ничего не меняет ни в Директе, ни на сайте.
# Результат — JSON в ветку claude/audit-shots (direct/dump.json). Запуск: коммит tools/direct-read/request.txt.
name: direct-read

on:
  push:
    branches: [claude/greeting-check-in-gdeerr]
    paths: ['tools/direct-read/request.txt']

permissions:
  contents: write

concurrency:
  group: direct-read
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /tools/direct-read/
          sparse-checkout-cone-mode: false
      - name: Ключ
        env:
          SSH_HOST: ${{ secrets.FTP_SERVER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '\r\n'); BASE=$(printf '%s' "$SSH_USER" | tr -d '\r\n' | sed 's/_[12]$//')
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519; ssh-keyscan -t ed25519,rsa "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "HOST=$HOST" >> $GITHUB_ENV; echo "BASE=$BASE" >> $GITHUB_ENV
      - name: Прочитать Директ на сервере
        shell: bash
        run: |
          set -euo pipefail
          SSHO="-i $HOME/.ssh/id_ed25519 -o BatchMode=yes"
          ssh $SSHO "$BASE@$HOST" "mkdir -p ~/_deploy_tmp/direct-read"
          scp $SSHO tools/direct-read/dump.php "$BASE@$HOST:_deploy_tmp/direct-read/dump.php"
          ssh $SSHO "$BASE@$HOST" 'cd ~/_deploy_tmp/direct-read && php dump.php ~/zavod-red.ru/public_html; rc=$?; rm -rf ~/_deploy_tmp/direct-read; exit $rc' > /tmp/dump.json
          python3 -c "import json;d=json.load(open('/tmp/dump.json'));print({k:(len(v) if isinstance(v,list) else v) for k,v in d.items()})"
      - name: Сохранить в claude/audit-shots
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/res && cd /tmp/res
          git init -q -b claude/audit-shots
          git config user.name "direct-read bot"; git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin claude/audit-shots 2>/dev/null; then git reset -q --hard FETCH_HEAD; fi
          mkdir -p direct && cp /tmp/dump.json direct/dump.json
          git add -A; git commit -q -m "direct-read: выгрузка Директа" || { echo "нечего коммитить"; exit 0; }
          for i in 1 2 3 4; do git push -q origin HEAD:claude/audit-shots && exit 0; sleep $((2**i)); git fetch -q origin claude/audit-shots && git rebase -q FETCH_HEAD || true; done
          exit 1
