# Оптимизация nginx для zavod-red.ru — применить на хостинге (Timeweb / VDS).
# Требует прав на правку конфига nginx. Найдено аудитом производительности 10.07.2026.
# После правки: nginx -t && systemctl reload nginx (или перезапуск через панель хостинга).

# ─────────────────────────────────────────────────────────────────────────
# 1) BROTLI — сжатие лучше gzip на 15–20% для текста (HTML/CSS/JS/JSON/SVG).
#    Требует модуль ngx_brotli (обычно уже собран у Timeweb; если нет — попросить поддержку).
#    Вставить в блок server{} (или http{}) сайта.
# ─────────────────────────────────────────────────────────────────────────
brotli            on;
brotli_comp_level 6;
brotli_static     on;            # отдавать заранее сжатые .br, если лежат рядом с файлом
brotli_types
    text/html
    text/css
    text/plain
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ─────────────────────────────────────────────────────────────────────────
# 2) РЕДИРЕКТ БЕЗ СЛЭША: сейчас /catalog → 301 → http://…/catalog/ (даунгрейд на http
#    + лишний хоп). Причина — nginx строит абсолютный редирект с неверной схемой.
#    Отключаем абсолютный редирект — nginx отдаст относительный «Location: /catalog/»,
#    браузер сам достроит https. Один хоп, без http.
# ─────────────────────────────────────────────────────────────────────────
absolute_redirect off;
port_in_redirect  off;
# (если директория с автo-слэшем всё равно уходит на http — дополнительно можно явно:
#  if ($scheme = http) { return 301 https://$host$request_uri; }  — но это временный костыль,
#  absolute_redirect off решает корректнее.)

# ─────────────────────────────────────────────────────────────────────────
# Уже настроено верно (не трогать): HTTP/2 on; gzip on; статика max-age=31536000;
# HTML no-cache; JSON max-age=2592000.
# ─────────────────────────────────────────────────────────────────────────
