# Оптимизация nginx для zavod-red.ru — Timeweb virtual hosting (nginx 1.30 + Apache).
# Обновлено 10.07.2026 после диагностики стека.
#
# ВАЖНО — что уже сделано и что осталось:
#
#  ✅ РЕДИРЕКТ директорий без слэша (/catalog → http://…/catalog/) — ПОЧИНЕН в .htaccess
#     (Apache DirectorySlash за прокси генерил http). Правило в корневом .htaccess,
#     деплоится автоматически. Этот файл больше НЕ нужен для редиректа.
#
#  ⏳ BROTLI на статике (css/js/json/svg) — ЕДИНСТВЕННОЕ, что осталось и требует nginx.
#     Причина: статику отдаёт nginx НАПРЯМУЮ (проверено: max-age=31536000, ETag,
#     Accept-Ranges — Apache/.htaccess её не касается). Поэтому brotli для ассетов
#     нельзя включить через .htaccess/FTP — только конфигом nginx или в панели Timeweb.
#
# ─────────────────────────────────────────────────────────────────────────
# BROTLI — сжатие лучше gzip на 15–20% для текста (HTML/CSS/JS/JSON/SVG).
# Требует модуль ngx_brotli. Как включить на Timeweb:
#   Вариант А (панель): Хостинг → сайт zavod-red.ru → «Настройки» → сжатие → Brotli (если есть тумблер).
#   Вариант Б (поддержка): написать в поддержку «включите ngx_brotli для сайта».
#   Вариант В (VDS/свой конфиг): вставить в блок server{} сайта строки ниже.
# ─────────────────────────────────────────────────────────────────────────
brotli            on;
brotli_comp_level 6;
brotli_static     on;            # отдавать заранее сжатые .br, если лежат рядом с файлом
brotli_types
    text/html
    text/css
    text/plain
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

# ─────────────────────────────────────────────────────────────────────────
# Уже настроено верно (не трогать): HTTP/2 on; gzip on; статика max-age=31536000;
# HTML no-cache; JSON max-age. Редирект/HTTPS/заголовки безопасности — в .htaccess.
# ─────────────────────────────────────────────────────────────────────────
